name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      update-screenshots:
        description: Re-shoot the compared screenshots and upload them as an artifact (nothing is committed)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit tests, build, end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      # The Vite config uses features its native loader warns about on every start.
      VITE_CONFIG_NATIVE_IGNORE_WARNING: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx vite build

      # Browsers are cached per Playwright version (read from the lockfile).
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: End-to-end tests
        run: npx playwright test ${{ inputs.update-screenshots && '--update-snapshots' || '' }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload screens and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens
          path: test-results/
          retention-days: 14

      - name: Upload re-shot screenshot baselines
        if: ${{ inputs.update-screenshots }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-baselines
          path: e2e/__screenshots__/
